<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6fe0">
  <meta name="description" content="用鍵盤練習常用中文字嘅速成碼。離線都用得。">
  <title>練習打中文速成</title>
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <h1>練習打中文速成</h1>
      <div class="top-stats" id="top-stats" aria-label="今次成績">
        <span>答對 0／0</span>
        <span class="sep" aria-hidden="true"></span>
        <span>準確率 —</span>
        <span class="sep" aria-hidden="true"></span>
        <span>連勝 0</span>
      </div>
    </header>

    <main class="workspace">
      <div class="left-col">
        <section class="card practice" id="practice" aria-label="練習">
          <p class="loading">載入緊字表…</p>
        </section>
        <div class="shortcut-bar" aria-label="鍵盤快捷鍵">
          <span><kbd>Enter</kbd> 提交</span>
          <span class="sep" aria-hidden="true"></span>
          <span><kbd>Esc</kbd> 清除</span>
          <span class="sep" aria-hidden="true"></span>
          <span><kbd>Space</kbd> 下一題</span>
          <span class="sep" aria-hidden="true"></span>
          <span><kbd>Tab</kbd> 睇提示</span>
        </div>
      </div>

      <aside class="card side" id="side">
        <h2>今次練習</h2>
        <p class="muted">載入緊…</p>
      </aside>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="map-title">
    <div class="map-page">
      <header class="map-top">
        <div class="map-brand">練習打中文速成</div>
        <h2 id="map-title">速成／倉頡 24 個字根</h2>
        <button type="button" class="btn btn-solid btn-small" data-action="close-map">返回練習 <kbd>Esc</kbd></button>
      </header>
      <div id="map-keys" class="map-board"></div>
      <div id="map-legend" class="legend"></div>
      <p class="map-note">
        速成：取倉頡碼嘅頭尾兩碼。例：明 = 日月（AB）<br>
        字根對應第五代倉頡。碼表來自 Rime cangjie5（LGPL）。
      </p>
    </div>
  </div>

  <p id="live" class="sr-only" aria-live="polite"></p>
  <input id="catcher" class="catcher" lang="en" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="輸入速成碼">

  <noscript>
    <p class="noscript">要開住 JavaScript 先練到。請用 Chrome 或 Edge。</p>
  </noscript>
  <script src="./app.js"></script>
</body>
</html>
